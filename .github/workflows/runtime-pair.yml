name: "Trusted current and legacy runtime evidence"

on:
  workflow_call:
    secrets:
      LOCALSTACK_CI_AUTH_TOKEN:
        required: true

jobs:
  runtime-pair:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment: localstack-current
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: "Install AWS CDK CLI"
        run: npm install -g aws-cdk@2.1148.0
      - name: "Run trusted legacy profile"
        run: dotnet tools/localstack-tool.cs -- run-runtime legacy "$GITHUB_WORKSPACE/artifacts/runtime/legacy"
      - name: "Run trusted current profile"
        if: success() || failure()
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_CI_AUTH_TOKEN }}
          MSBUILDDISABLENODEREUSE: '1'
          UseSharedCompilation: 'false'
        run: dotnet tools/localstack-tool.cs -- run-runtime current "$GITHUB_WORKSPACE/artifacts/runtime/current"
      - name: "Require both passing clean-source runtime records"
        if: always()
        run: dotnet tools/localstack-tool.cs -- validate-runtime artifacts/runtime/current artifacts/runtime/legacy
      - name: "Upload runtime reports and evidence"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-evidence-${{ github.sha }}
          path: artifacts/runtime/
          retention-days: 7
